<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabin Verse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f5f2ed;
            color: #333;
        }

        /* 헤더 */
        .header-top {
            background: #2c2c2c;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-left {
            flex: 1;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #d4a574;
            line-height: 1.2;
        }

        .tagline {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.4rem;
            letter-spacing: 0.5px;
        }

        .header-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .header-buttons button {
            background: none;
            border: 1px solid #d4a574;
            color: #d4a574;
            padding: 0.35rem 0.7rem;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .header-buttons button:hover {
            background: #d4a574;
            color: #2c2c2c;
        }

        /* 배너 */
        .banner {
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 400"><rect fill="%23654321" width="1500" height="400"/></svg>');
            background-size: cover;
            background-position: center;
            height: 300px;
        }

        /* 타이틀 영역 */
        .title-section {
            background: white;
            padding: 4rem 2rem;
            text-align: center;
        }

        .section-title {
            font-size: 3rem;
            color: #3c3c3c;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        /* 네비게이션 */
        .navbar {
            background: #2c2c2c;
            padding: 1rem 2rem;
            text-align: center;
            border-bottom: 2px solid #d4a574;
        }

        .navbar a {
            color: #999;
            text-decoration: none;
            margin: 0 1.2rem;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            display: inline-block;
        }

        .navbar a:hover {
            color: #d4a574;
        }

        .navbar a.youtube {
            color: #d4a574;
            font-weight: 600;
        }

        /* 메인 컨텐츠 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* 비디오 그리드 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .video-item {
            text-align: center;
            background: white;
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #ddd;
            position: relative;
            overflow: hidden;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(212, 165, 116, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }

        .video-info {
            padding: 1rem;
        }

        .video-category {
            font-size: 0.75rem;
            color: #999;
            margin-bottom: 0.3rem;
        }

        .video-title {
            font-weight: 600;
            color: #3c3c3c;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* 페이지네이션 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.3rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .pagination a, .pagination span {
            padding: 0.5rem 0.7rem;
            border: 1px solid #ddd;
            border-radius: 3px;
            text-decoration: none;
            color: #3c3c3c;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .pagination a:hover {
            border-color: #d4a574;
            color: #d4a574;
        }

        .pagination .active {
            background: #3c3c3c;
            color: white;
            border-color: #3c3c3c;
        }

        /* 버튼 */
        .view-all-btn {
            display: inline-block;
            padding: 0.7rem 2rem;
            border: 1px solid #d4a574;
            background: transparent;
            color: #d4a574;
            text-decoration: none;
            border-radius: 3px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .view-all-btn:hover {
            background: #d4a574;
            color: white;
        }

        .view-all-section {
            text-align: center;
            margin: 3rem 0;
        }

        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 2rem;
            border-radius: 8px;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }

        .modal-header h2 {
            font-size: 1.2rem;
            color: #3c3c3c;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #999;
            cursor: pointer;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-form input,
        .modal-form textarea {
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .modal-form input:focus,
        .modal-form textarea:focus {
            outline: none;
            border-color: #d4a574;
        }

        .modal-form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .modal-form button {
            padding: 0.8rem;
            background: #d4a574;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .modal-form button:hover {
            background: #c9916f;
        }

        .modal-footer {
            text-align: center;
            font-size: 0.85rem;
            color: #999;
            margin-top: 1rem;
        }

        /* 푸터 */
        footer {
            background: #2c2c2c;
            color: #999;
            text-align: center;
            padding: 2rem;
            font-size: 0.9rem;
        }

        @media (max-width: 1024px) {
            .video-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .header-top {
                flex-direction: column;
                gap: 1rem;
            }

            .navbar a {
                margin: 0 0.6rem;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div class="header-top">
        <div class="header-left">
            <div class="logo">SABIN VERSE</div>
            <div class="tagline">시가 노래가 되고 노래가 감정이 되는 곳</div>
        </div>
        <div class="header-buttons">
            <button onclick="openContactForm()">✉️ Contact Us</button>
            <button onclick="adminLogin()">관리자</button>
        </div>
    </div>

    <!-- 배너 -->
    <div class="banner"></div>

    <!-- 타이틀 -->
    <div class="title-section">
        <h1 class="section-title">영상으로야</h1>
    </div>

    <!-- 네비게이션 -->
    <div class="navbar">
        <a href="#about">소개글</a>
        <a href="#poem">시낭송</a>
        <a href="#music">영상음악</a>
        <a href="#photo">디카시</a>
        <a href="#guestbook">방명록</a>
        <a href="#board">게시판</a>
        <a href="#notice">공지사항</a>
        <a href="https://youtube.com/@sabinverse" target="_blank" class="youtube">▶ YouTube</a>
    </div>

    <!-- 메인 컨텐츠 -->
    <div class="container">
        <!-- 비디오 그리드 -->
        <div class="video-grid">
            <div class="video-item">
                <div class="video-thumbnail">
                    <div class="play-btn">▶</div>
                </div>
                <div class="video-info">
                    <div class="video-category">영상음악</div>
                    <div class="video-title">3차 플레이리스트</div>
                </div>
            </div>
            <div class="video-item">
                <div class="video-thumbnail">
                    <div class="play-btn">▶</div>
                </div>
                <div class="video-info">
                    <div class="video-category">영상음악</div>
                    <div class="video-title">추억을 잠시</div>
                </div>
            </div>
            <div class="video-item">
                <div class="video-thumbnail">
                    <div class="play-btn">▶</div>
                </div>
                <div class="video-info">
                    <div class="video-category">영상음악</div>
                    <div class="video-title">네 심장은 두근 박</div>
                </div>
            </div>
            <div class="video-item">
                <div class="video-thumbnail">
                    <div class="play-btn">▶</div>
                </div>
                <div class="video-info">
                    <div class="video-category">영상음악</div>
                    <div class="video-title">못다한 내 사랑</div>
                </div>
            </div>
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination">
            <span class="active">1</span>
            <a href="#">2</a>
            <a href="#">3</a>
            <a href="#">4</a>
            <a href="#">5</a>
            <a href="#">6</a>
            <a href="#">7</a>
            <a href="#">8</a>
            <a href="#">9</a>
            <a href="#">›</a>
        </div>

        <!-- 전체영상 보기 -->
        <div class="view-all-section">
            <button class="view-all-btn">전체영상 보기</button>
        </div>
    </div>

    <!-- Contact Us 모달 -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✉️ Contact Us</h2>
                <button class="close-btn" onclick="closeContactForm()">&times;</button>
            </div>
            <form class="modal-form" onsubmit="submitContact(event)">
                <input type="text" id="name" placeholder="이름" required>
                <input type="email" id="email" placeholder="이메일" required>
                <input type="text" id="subject" placeholder="제목" required>
                <textarea id="message" placeholder="메시지" required></textarea>
                <button type="submit">전송</button>
            </form>
            <div class="modal-footer">
                📧 master@sabinverse.com으로 전송됩니다
            </div>
        </div>
    </div>

    <!-- 푸터 -->
    <footer>
        <p><strong>Sabin Verse © 2026</strong></p>
        <p>Sabin Verse · All rights reserved</p>
    </footer>

    <script>
        function openContactForm() {
            document.getElementById('contactModal').style.display = 'block';
        }

        function closeContactForm() {
            document.getElementById('contactModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('contactModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        function submitContact(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            const mailtoLink = `mailto:master@sabinverse.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(`발신자: ${name} (${email})\n\n${message}`)}`;
            window.location.href = mailtoLink;

            document.querySelector('.modal-form').reset();
            closeContactForm();
        }

        function adminLogin() {
            const password = prompt('관리자 비밀번호를 입력하세요:');
            if (password) {
                alert('관리자 패널로 이동합니다');
            }
        }
    </script>
</body>
</html>
