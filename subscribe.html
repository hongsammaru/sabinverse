<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sabin verse — 시가 노래가 되는 순간</title>
<meta property="og:title" content="sabin verse — 시가 노래가 되는 순간을 함께해요">
<meta property="og:description" content="시인이자 작사가 사빈의 영상시와 영상음악">
<meta property="og:image" content="https://sabinverse.com/subscribe.png">
<meta property="og:url" content="https://sabinverse.com/subscribe.html">
<meta property="og:type" content="website">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 80% at 50% 0%, #2a1030 0%, #14060f 60%, #0b0409 100%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
    font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  .stage{width:100%;max-width:520px}
  .frame{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .frame img{display:block;width:100%;height:auto}
  .veil{
    position:absolute;left:0;right:0;bottom:0;
    padding:56px 24px 26px;
    background:linear-gradient(to top, rgba(8,3,10,.92) 30%, rgba(8,3,10,.55) 65%, rgba(8,3,10,0) 100%);
  }
  .line{
    margin:0 0 16px;
    font-family:"Nanum Myeongjo",Georgia,"Apple SD Gothic Neo",serif;
    font-style:italic;
    font-size:clamp(15px,3.6vw,19px);
    color:#f3ece4;
    letter-spacing:.2px;
  }
  .line b{color:#e2b872;font-weight:600;font-style:italic}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .cta{
    display:inline-flex;align-items:center;gap:9px;
    background:#ff0033;color:#fff;
    text-decoration:none;
    font-size:clamp(15px,3.4vw,17px);font-weight:700;
    padding:13px 24px;border-radius:999px;
    box-shadow:0 6px 20px rgba(255,0,51,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cta:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(255,0,51,.55)}
  .cta:focus-visible{outline:3px solid #ffd9e2;outline-offset:3px}
  .cta svg{width:26px;height:19px;flex:none}
  .handle{color:#b9adb8;font-size:clamp(12px,2.9vw,14px)}

  @media (prefers-reduced-motion: no-preference){
    .cta{animation:breathe 3.2s ease-in-out infinite}
    @keyframes breathe{
      0%,100%{box-shadow:0 6px 20px rgba(255,0,51,.35)}
      50%{box-shadow:0 6px 30px rgba(255,0,51,.6)}
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <img src="subscribe.png" alt="무대 위에서 마이크를 잡고 노래하는 sabin">
      <div class="veil">
        <p class="line">시가 노래가 되는 순간을 함께해요 — <b>sabin verse</b></p>
        <div class="row">
          <!-- ▼ 버튼 글자는 아래 '영상 보러가기'만 바꾸면 됩니다 ▼ -->
          <a class="cta" href="https://youtube.com/@sabin-verse-26" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 17" fill="none" aria-hidden="true">
              <rect width="24" height="17" rx="4" fill="#fff"/>
              <path d="M9.5 4.5v8l7-4-7-4z" fill="#ff0033"/>
            </svg>
            영상 보러가기
          </a>
          <span class="handle">@Sabin-Verse-26 · 시인 · 작사가</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
