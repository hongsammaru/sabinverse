<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>가사에서 설명란까지 · sabin verse</title>
<style>html,body{margin:0;padding:0;background:#F0EDF4;}</style>
</head>
<body>
<div id="sv-root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

#sv-root {
  --paper:#F0EDF4; --ink:#1F1B2E; --muted:#7A7290;
  --rose:#C4536B; --veil:#DED7E8; --sheet:#FBFAFD;
  background:var(--paper); color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh; padding:28px 18px 60px; box-sizing:border-box;
  -webkit-text-size-adjust:100%;
}
#sv-root *{box-sizing:border-box;}
.sv-wrap{max-width:620px;margin:0 auto;}

.sv-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);}
.sv-h1{font-family:'Gowun Batang',serif;font-size:30px;font-weight:700;
  margin:8px 0 0;line-height:1.25;letter-spacing:-.01em;}
.sv-sub{color:var(--muted);font-size:15px;margin:8px 0 26px;line-height:1.6;}

.sv-sheet{background:var(--sheet);border:1px solid var(--veil);border-radius:14px;
  overflow:hidden;margin-bottom:14px;display:flex;}
.sv-gutter{width:40px;flex-shrink:0;border-right:1px solid var(--veil);padding:18px 0;
  text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;
  color:var(--muted);line-height:1.9;user-select:none;}
#sv-lyrics{flex:1;min-height:260px;border:none;background:transparent;resize:vertical;
  padding:18px 16px;font-family:'Gowun Batang',serif;font-size:17px;line-height:1.95;
  color:var(--ink);outline:none;width:100%;}

.sv-input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid var(--veil);
  background:var(--sheet);font-size:16px;font-family:Pretendard,sans-serif;
  color:var(--ink);margin-bottom:14px;}
.sv-input-mini{padding:13px;border-radius:10px;font-size:15px;margin-bottom:8px;}
.sv-ta{min-height:150px;resize:vertical;line-height:1.7;font-family:Pretendard,sans-serif;}
.sv-fixed-label{font-size:13px;color:var(--muted);margin:10px 0 6px;}
#sv-root ::placeholder{color:var(--muted);opacity:.55;}

.sv-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.sv-chip{padding:10px 15px;border-radius:999px;border:1px solid var(--veil);
  background:transparent;color:var(--muted);font-size:14px;
  font-family:Pretendard,sans-serif;cursor:pointer;transition:all .15s;}
.sv-chip.on{border-color:var(--rose);background:var(--rose);color:var(--sheet);}

.sv-check{display:flex;align-items:center;gap:10px;background:none;border:none;
  padding:8px 0;cursor:pointer;color:var(--ink);font-size:15px;
  font-family:Pretendard,sans-serif;}
.sv-box{width:20px;height:20px;border-radius:6px;border:1px solid var(--muted);
  display:grid;place-items:center;font-size:13px;color:transparent;flex-shrink:0;}
.sv-check.on .sv-box{border-color:var(--rose);background:var(--rose);color:var(--sheet);}

.sv-link-toggle{background:none;border:none;padding:10px 0;cursor:pointer;
  color:var(--muted);font-size:15px;text-decoration:underline;font-family:Pretendard,sans-serif;display:block;}
#sv-links{display:none;margin-top:8px;}
#sv-links.on{display:block;}

#sv-go{width:100%;padding:17px;border-radius:12px;border:none;background:var(--ink);
  color:var(--paper);font-size:16px;font-weight:600;font-family:Pretendard,sans-serif;
  cursor:pointer;transition:background .2s;margin-top:8px;}
#sv-go:disabled{background:var(--muted);cursor:default;}

#sv-error{background:#F7E4E8;color:#8E2A40;padding:12px 14px;border-radius:10px;
  font-size:14px;margin-bottom:12px;display:none;}
#sv-error.on{display:block;}

#sv-out{margin-top:44px;}
.sv-part{margin-bottom:12px;}
.sv-part-h{font-family:'Gowun Batang',serif;font-size:22px;font-weight:700;
  padding-bottom:10px;border-bottom:1px solid var(--veil);margin:0 0 20px;
  display:flex;align-items:baseline;gap:10px;}
.sv-part-h small{font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.14em;color:var(--muted);font-weight:400;}
.sv-gap{height:46px;}

.sv-block{margin-bottom:22px;animation:sv-rise .45s cubic-bezier(.2,.7,.3,1) both;}
@keyframes sv-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sv-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);}
.sv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sv-body{background:var(--sheet);border:1px solid var(--veil);border-radius:12px;
  padding:16px;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.9;}
.sv-body.serif{font-family:'Gowun Batang',serif;}
.sv-title-row{display:flex;align-items:center;gap:12px;background:var(--sheet);
  border:1px solid var(--veil);border-radius:12px;padding:13px 14px;margin-bottom:8px;}
.sv-title-row span{font-family:'Gowun Batang',serif;font-size:16px;line-height:1.6;flex:1;}

.sv-copy{border:1px solid var(--veil);background:transparent;color:var(--muted);
  border-radius:999px;padding:8px 15px;font-size:13px;font-family:Pretendard,sans-serif;
  cursor:pointer;flex-shrink:0;transition:all .15s;}
.sv-copy.done{border-color:var(--rose);background:var(--rose);color:var(--sheet);}

#sv-root button:active{transform:scale(.98);}
#sv-root *:focus-visible{outline:2px solid var(--rose);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){.sv-block{animation:none;}}
@media (max-width:480px){
  #sv-root{padding:22px 14px 60px;}
  .sv-h1{font-size:26px;}
  .sv-gutter{width:34px;font-size:10px;}
  #sv-lyrics{padding:18px 12px;font-size:16px;}
}
</style>

<div class="sv-wrap">
  <div class="sv-eyebrow">sabin verse</div>
  <h1 class="sv-h1">가사에서 설명란까지</h1>
  <p class="sv-sub">가사를 붙여넣으면 동영상용과 쇼츠용을 한 번에 만들어 드립니다.</p>

  <div class="sv-sheet">
    <div class="sv-gutter" id="sv-gutter">01</div>
    <textarea id="sv-lyrics" placeholder="여기에 가사를 붙여넣으세요.&#10;&#10;한 줄씩 그대로 넣으면 됩니다."></textarea>
  </div>


  <div class="sv-chips" id="sv-genres"></div>

  <button class="sv-check on" id="sv-inc"><span class="sv-box">✓</span>동영상 설명란에 가사 전문 넣기</button>
  <button class="sv-link-toggle" id="sv-linkbtn">키와 링크 설정</button>
  <div id="sv-links">
    <input class="sv-input sv-input-mini" id="sv-key" type="password" placeholder="Anthropic API 키 (sk-ant-...)">
    <input class="sv-input sv-input-mini" id="sv-site" value="https://sabinverse.com" placeholder="홈페이지 주소">
    <input class="sv-input sv-input-mini" id="sv-x" placeholder="X 프로필 주소">
    <div class="sv-fixed-label">고정 문구 · 동영상 설명 아래에 항상 붙습니다</div>
    <textarea class="sv-input sv-input-mini sv-ta" id="sv-fixed"></textarea>
    <div class="sv-fixed-label">고정 해시태그 · 곡마다 나오는 태그 앞에 붙습니다</div>
    <input class="sv-input sv-input-mini" id="sv-fixtags">
  </div>

  <div id="sv-error"></div>
  <button id="sv-go">설명 만들기</button>

  <div id="sv-out"></div>
</div>

<script>
(function(){
  var GENRES = ["발라드","트롯","세미트롯"];
  var genre = "발라드", includeLyrics = true;

  var $ = function(id){ return document.getElementById(id); };
  var lyricsEl = $("sv-lyrics"), gutter = $("sv-gutter"), out = $("sv-out"),
      errEl = $("sv-error"), goBtn = $("sv-go");

  function drawGutter(){
    var n = lyricsEl.value.trim() ? lyricsEl.value.split("\n").length : 1;
    var s = "";
    for (var i=1; i<=n; i++) s += ("0"+i).slice(-2) + "<br>";
    gutter.innerHTML = s;
  }
  lyricsEl.addEventListener("input", drawGutter);

  GENRES.forEach(function(m){
    var b = document.createElement("button");
    b.className = "sv-chip" + (m === genre ? " on" : ""); b.textContent = m;
    b.onclick = function(){
      genre = (genre === m) ? "" : m;
      Array.prototype.forEach.call($("sv-genres").children, function(c){
        c.className = "sv-chip" + (c.textContent === genre ? " on" : "");
      });
    };
    $("sv-genres").appendChild(b);
  });

  $("sv-inc").onclick = function(){
    includeLyrics = !includeLyrics;
    this.className = "sv-check" + (includeLyrics ? " on" : "");
  };
  $("sv-linkbtn").onclick = function(){
    var on = $("sv-links").classList.toggle("on");
    this.textContent = on ? "설정 접기" : "키와 링크 설정";
  };

  function copyText(text, btn){
    var done = function(){
      btn.textContent = "복사됨"; btn.classList.add("done");
      setTimeout(function(){ btn.textContent = "복사"; btn.classList.remove("done"); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallback(text); done(); });
    } else { fallback(text); done(); }
  }
  function fallback(text){
    var t = document.createElement("textarea");
    t.value = text; t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch(e){}
    document.body.removeChild(t);
  }

  function block(label, body, serif){
    var d = document.createElement("div"); d.className = "sv-block";
    var h = document.createElement("div"); h.className = "sv-head";
    var l = document.createElement("div"); l.className = "sv-label"; l.textContent = label;
    var c = document.createElement("button"); c.className = "sv-copy"; c.textContent = "복사";
    c.onclick = function(){ copyText(body, c); };
    h.appendChild(l); h.appendChild(c);
    var b = document.createElement("div");
    b.className = "sv-body" + (serif ? " serif" : "");
    b.textContent = body;
    d.appendChild(h); d.appendChild(b);
    return d;
  }

  function titleList(titles){
    var d = document.createElement("div"); d.className = "sv-block";
    var l = document.createElement("div"); l.className = "sv-label";
    l.textContent = "제목 후보"; l.style.marginBottom = "10px";
    d.appendChild(l);
    (titles || []).forEach(function(t){
      var row = document.createElement("div"); row.className = "sv-title-row";
      var sp = document.createElement("span"); sp.textContent = t;
      var c = document.createElement("button"); c.className = "sv-copy"; c.textContent = "복사";
      c.onclick = function(){ copyText(t, c); };
      row.appendChild(sp); row.appendChild(c); d.appendChild(row);
    });
    return d;
  }

  function commentList(items){
    var d = document.createElement("div"); d.className = "sv-block";
    var l = document.createElement("div"); l.className = "sv-label";
    l.textContent = "댓글"; l.style.marginBottom = "10px";
    d.appendChild(l);
    (items || []).forEach(function(t){
      var row = document.createElement("div"); row.className = "sv-title-row";
      var sp = document.createElement("span"); sp.textContent = t;
      var c = document.createElement("button"); c.className = "sv-copy"; c.textContent = "복사";
      c.onclick = function(){ copyText(t, c); };
      row.appendChild(sp); row.appendChild(c); d.appendChild(row);
    });
    return d;
  }

  function heading(title, note){
    var h = document.createElement("h2"); h.className = "sv-part-h";
    h.appendChild(document.createTextNode(title));
    var s = document.createElement("small"); s.textContent = note;
    h.appendChild(s);
    return h;
  }

  function showError(msg){ errEl.textContent = msg; errEl.classList.add("on"); }

  goBtn.onclick = async function(){
    var lyrics = lyricsEl.value.trim();
    errEl.classList.remove("on");
    if (!lyrics) { showError("가사를 먼저 붙여넣어 주세요."); return; }

    var apiKey = $("sv-key").value.trim();
    if (!apiKey) {
      showError("API 키를 넣어 주세요. 아래 '키와 링크 설정'을 여시면 입력칸이 있습니다.");
      $("sv-links").classList.add("on");
      $("sv-linkbtn").textContent = "설정 접기";
      return;
    }
    try { localStorage.setItem("sv_key", apiKey); } catch(e){}

    out.innerHTML = "";
    goBtn.disabled = true; goBtn.textContent = "쓰는 중…";

    var site = $("sv-site").value.trim();
    var xurl = $("sv-x").value.trim();

    var head =
"당신은 유튜브 음악 채널 'sabin verse'의 콘텐츠를 정리하는 편집자입니다.\n" +
"채널 주인 사빈(sabin)은 한국의 시인이자 작사가이며, 가사는 시적이고 절제된 문장을 씁니다.\n" +
"홍보용 과장, 느낌표 남발, 이모지 도배를 하지 않습니다. 조용하고 담백한 톤을 유지합니다.\n" +
"가사에 [Intro] [Verse] [Chorus] 같은 구조 표기나 제목 줄이 섞여 있으면 곡 구조를 파악하는 데만 쓰고, 결과물에는 그대로 옮기지 마세요.\n\n" +
"장르: " + (genre || "(가사에서 직접 판단)") + "\n" +
"장르에 맞춰 해시태그와 어투를 정하세요. 발라드는 조용하고 절제된 문장으로, 트롯과 세미트롯은 좀 더 정감 있고 직설적인 문장으로 씁니다. 해시태그도 장르에 맞는 것을 넣으세요. 트롯 계열이면 발라드 관련 태그를 넣지 마세요.\n" +
"가사:\n\"\"\"\n" + lyrics + "\n\"\"\"\n\n";

    var pV1 = head +
"위 가사를 읽고 아래 두 가지를 한국어로 만드세요.\n" +
"- titles: 유튜브 제목 후보 3개. 반드시 이 형식을 지키세요: 👉곡명/구절/#태그 #태그\n" +
"  · 곡명은 가사 맨 위 제목을 그대로 씁니다.\n" +
"  · 구절은 2~5글자로 짧게. 곡의 간절함을 한마디로 압축한 말이거나 가사에서 가져온 말. 예: 제발, 한번만, 눈감아줘요\n" +
"  · 태그는 2개. #으로 시작하고 공백 없이. 하나는 장르 태그, 하나는 곡에 맞는 검색어로.\n" +
"  · 세 후보는 구절과 태그를 서로 다르게 씁니다. 각 40자 이내.\n" +
"- description: 유튜브 설명란 본문. 곡의 정서를 짚는 첫 문단(2~3문장)과 짧은 노트(2~3문장). 가사를 그대로 옮기지 말고, 링크나 해시태그는 넣지 마세요. 전체 400자 이내.\n\n" +
"JSON만 출력하세요. 코드펜스나 다른 말은 절대 붙이지 마세요.\n" +
'{"titles":["","",""],"description":""}';

    var pV2 = head +
"위 가사를 읽고 아래 세 가지를 만드세요.\n" +
"- hashtags: 정확히 5개. 각 항목은 #으로 시작하고 공백 없이. 이 곡에만 해당하는 말로 고르고, 서로 뜻이 겹치지 않게 합니다. 곡명은 반드시 넣으세요.\n" +
"- tags: 유튜브 태그 입력란용 키워드 정확히 5개. #을 붙이지 않습니다. 뜻이 겹치는 말을 넣지 마세요. 예를 들어 '한국 발라드'와 '감성 발라드'와 'Korean ballad'는 하나만 씁니다.\n" +
"- pinnedComment: 고정 댓글. 곡을 쓴 마음을 한 문장으로 말하고, 끝에 듣는 사람에게 건네는 짧은 질문을 붙입니다. 두 문장 이내.\n" +
"- comments: 일반 댓글 2개. 고정 댓글과 겹치지 않게 씁니다. 각각 다른 방식으로 말을 겁니다. 하나는 가사 한 구절을 짚으며 어떻게 들렸는지 묻고, 다른 하나는 듣는 사람의 이야기를 끌어내는 질문으로 씁니다. 각 두 문장 이내. 광고 문구처럼 들리지 않게, 사람이 쓴 말투로.\n\n" +
"JSON만 출력하세요. 코드펜스나 다른 말은 절대 붙이지 마세요.\n" +
'{"hashtags":[""],"tags":[""],"pinnedComment":"","comments":["",""]}';

    var pS = head +
"위 가사로 유튜브 쇼츠에 쓸 문구를 만드세요. 동영상 설명과는 다른 표현을 쓰세요.\n" +
"- titles: 쇼츠 제목 후보 3개. 반드시 이 형식을 지키세요: 곡명/구절 #태그\n" +
"  · 맨 앞에 이모지를 넣지 마세요.\n" +
"  · 곡명은 가사 맨 위 제목을 띄어쓰기 없이 붙여 씁니다. 예: 허락해주세요\n" +
"  · 구절은 2~5글자로 짧게. 동영상 제목과 다른 말을 고릅니다.\n" +
"  · 태그는 1개. 각 25자 이내.\n" +
"- pinnedComment: 쇼츠 고정 댓글. 한 문장, 끝에 짧은 질문을 붙입니다.\n" +
"- comments: 일반 댓글 2개. 각 한 문장. 서로 다른 방식으로 말을 겁니다.\n" +
"- description: 쇼츠 설명란. 2~3문장, 전체 120자 이내. 링크나 해시태그는 넣지 마세요.\n" +
"- hashtags: 정확히 5개. #Shorts를 맨 앞에 넣고, 나머지 4개는 이 곡에만 해당하는 말로 고릅니다. 서로 뜻이 겹치지 않게 합니다.\n" +
"- tags: 유튜브 태그 입력란용 키워드 정확히 5개. #을 붙이지 않습니다. 뜻이 겹치는 말을 넣지 마세요.\n\n" +
"JSON만 출력하세요. 코드펜스나 다른 말은 절대 붙이지 마세요.\n" +
'{"titles":["","",""],"description":"","hashtags":[""],"tags":[""],"pinnedComment":"","comments":["",""]}';

    async function ask(p){
      var res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: p }]
        })
      });
      var data = await res.json();
      if (data.error) throw new Error(data.error.message || "API 오류");
      if (!data.content) throw new Error("응답이 비어 있습니다.");
      var raw = data.content.map(function(i){ return i.type === "text" ? i.text : ""; }).join("");
      var s = raw.indexOf("{"), e = raw.lastIndexOf("}");
      if (s === -1 || e === -1) throw new Error("응답 형식을 읽지 못했습니다.");
      return JSON.parse(raw.slice(s, e + 1));
    }

    try {
      var got = await Promise.all([ask(pV1), ask(pV2), ask(pS)]);
      var v = Object.assign({}, got[0], got[1]);
      var sh = got[2];

      var links = [];
      if (site) links.push("홈페이지: " + site);
      if (xurl) links.push("X: " + xurl);

      var fixed = $("sv-fixed").value.trim();
      var fixTags = $("sv-fixtags").value.trim().split(/\s+/).filter(Boolean);

      function mergeTags(gen){
        var seen = {}, outArr = [];
        fixTags.concat(gen || []).forEach(function(t){
          var k = t.toLowerCase();
          if (t && !seen[k]) { seen[k] = 1; outArr.push(t); }
        });
        return outArr.join(" ");
      }

      // 동영상
      var vParts = ["[곡 설명]\n" + v.description];
      if (includeLyrics) vParts.push("─────────\n가사\n\n" + lyrics);
      if (fixed) vParts.push("─────────\n" + fixed);
      if (links.length) vParts.push(links.join("\n"));
      vParts.push(mergeTags(v.hashtags));
      var vFull = vParts.join("\n\n");

      out.appendChild(heading("동영상", "LONG FORM"));
      out.appendChild(titleList(v.titles));
      out.appendChild(block("설명란 전체", vFull, true));
      out.appendChild(block("유튜브 태그란", (v.tags || []).join(", "), false));
      if (v.pinnedComment) out.appendChild(block("고정 댓글", v.pinnedComment, true));
      if (v.comments && v.comments.length) out.appendChild(commentList(v.comments));

      var gap = document.createElement("div"); gap.className = "sv-gap";
      out.appendChild(gap);

      // 쇼츠
      var sParts = [sh.description];
      if (links.length) sParts.push(links.join("\n"));
      sParts.push("작사 사빈(SABIN) · 음원과 영상은 생성형 AI로 제작했습니다.");
      sParts.push(mergeTags(sh.hashtags));
      var sFull = sParts.join("\n\n");

      out.appendChild(heading("쇼츠", "SHORTS"));
      out.appendChild(titleList(sh.titles));
      out.appendChild(block("설명란 전체", sFull, true));
      out.appendChild(block("유튜브 태그란", (sh.tags || []).join(", "), false));
      if (sh.pinnedComment) out.appendChild(block("고정 댓글", sh.pinnedComment, true));
      if (sh.comments && sh.comments.length) out.appendChild(commentList(sh.comments));

      out.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      showError("생성에 실패했습니다. 다시 눌러 주세요. (" + (e.message || e) + ")");
    } finally {
      goBtn.disabled = false; goBtn.textContent = "설명 만들기";
    }
  };

  var DEFAULT_FIXED = [
"📋 곡 제작 정보",
"📌 작사: 사빈 (SABIN)",
"🎼 작곡·편곡: AI 협업 (생성형 AI 기술 활용)",
"🎨 이미지: AI 생성 콘텐츠",
"🎤 보컬: 감성 보이스 (AI 협업) · 감성 발라드 & 트롯 스타일",
"",
"📢 AI 콘텐츠 표기",
"본 영상의 오디오 및 시각 자료는 작사가 사빈의 가사를 바탕으로 생성형 AI 기술을 활용하여 제작되었습니다. 관련 법규를 준수하여 투명하게 공개합니다.",
"",
"매주 신곡을 올립니다."
].join("\n");

  var DEFAULT_FIXTAGS = "#사빈 #SABIN #sabinverse #작사가사빈 #중년감성 #AI음악 #AI제작 #AI콘텐츠";

  try {
    var savedFixed = localStorage.getItem("sv_fixed");
    $("sv-fixed").value = (savedFixed !== null) ? savedFixed : DEFAULT_FIXED;
    var savedFixTags = localStorage.getItem("sv_fixtags");
    $("sv-fixtags").value = (savedFixTags !== null) ? savedFixTags : DEFAULT_FIXTAGS;
    $("sv-fixed").addEventListener("input", function(){
      try { localStorage.setItem("sv_fixed", this.value); } catch(e){}
    });
    $("sv-fixtags").addEventListener("input", function(){
      try { localStorage.setItem("sv_fixtags", this.value); } catch(e){}
    });

    var savedKey = localStorage.getItem("sv_key");
    if (savedKey) $("sv-key").value = savedKey;
    var savedSite = localStorage.getItem("sv_site");
    if (savedSite) $("sv-site").value = savedSite;
    var savedX = localStorage.getItem("sv_x");
    if (savedX) $("sv-x").value = savedX;

    $("sv-key").addEventListener("input", function(){
      try { localStorage.setItem("sv_key", this.value.trim()); } catch(e){}
    });
    $("sv-site").addEventListener("input", function(){
      try { localStorage.setItem("sv_site", this.value.trim()); } catch(e){}
    });
    $("sv-x").addEventListener("input", function(){
      try { localStorage.setItem("sv_x", this.value.trim()); } catch(e){}
    });
  } catch(e){}

  drawGutter();
})();
</script>
</div>
</body>
</html>
